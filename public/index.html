<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preston Proxy</title>
    <!-- Core Proxy Setup Scripts -->
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .search-box {
            position: relative;
            margin-bottom: 40px;
        }
        input {
            width: 100%;
            padding: 15px 25px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 50px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        /* Quick Links System */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
        .card:hover {
            transform: translateY(-5px);
            background: #273549;
            border-color: #38bdf8;
        }
        .card.youtube:hover { box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3); }
        .card.tiktok:hover { box-shadow: 0 5px 15px rgba(254, 44, 85, 0.3); }
        .card.roblox:hover { box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Preston Proxy</h1>
        <p>Fast, secure, and unrestricted browser portal</p>

        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" id="proxy-search" placeholder="Enter a URL or search Google...">
        </div>

        <!-- Quick Links Hub -->
        <div class="quick-links">
            <div class="card youtube" onclick="launchProxy('https://www.youtube.com')">📺 YouTube</div>
            <div class="card tiktok" onclick="launchProxy('https://www.tiktok.com')">🎵 TikTok</div>
            <div class="card roblox" onclick="launchProxy('https://roblox.com')">🎮 Roblox</div>
        </div>
    </div>

    <script>
        // Engine Router Connection
        function launchProxy(url) {
            if (!url) return;
            // Encodes the address matching the XOR internal algorithm format
            window.location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
        }

        // Handle Search Bar Input Actions
        const searchInput = document.getElementById('proxy-search');
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let inputVal = searchInput.value.trim();
                // Simple validation to check if it's a direct URL link or search query
                if (!inputVal.startsWith('http://') && !inputVal.startsWith('https://')) {
                    if (inputVal.includes('.') && !inputVal.includes(' ')) {
                        inputVal = 'https://' + inputVal;
                    } else {
                        inputVal = 'https://google.com' + encodeURIComponent(inputVal);
                    }
                }
                launchProxy(inputVal);
            }
        });

        // Stealth Mode / Tab Cloaking Script
        function activateStealth() {
            document.title = "Google Docs";
            let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon';
            link.rel = 'shortcut icon';
            link.href = 'https://google.com';
            document.getElementsByTagName('head')[0].appendChild(link);
            
            if (window.top === window.self) {
                let win = window.open();
                if (win) {
                    win.document.body.style.margin = '0';
                    win.document.body.style.height = '100vh';
                    let iframe = win.document.createElement('iframe');
                    iframe.style.border = 'none';
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.src = window.location.href;
                    win.document.body.appendChild(iframe);
                    window.location.replace('https://google.com');
                }
            }
        }

        // Blocker Alert Tracker
        async function checkNetworkStatus() {
            try {
                const response = await fetch('/uv/service/', { method: 'HEAD' });
                if (!response.ok) throw new Error("Blocked");
            } catch (error) {
                alert("🚨 WARNING: Preston Proxy backend routes might be flagged by this network layout. Redeploy on Render if queries stop loading.");
            }
        }

        window.onload = function() {
            activateStealth();
            setTimeout(checkNetworkStatus, 5000);
        };
    </script>
</body>
</html>
